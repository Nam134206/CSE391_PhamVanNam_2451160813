<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class ="container">
        <h1 class="header">Quản lý sinh viên</h1>
        <div class="stats">
            <p>Tổng số sinh viên: <span id="totalStudents">0</span> | Điểm trung bình: <span id="avgScore">0</span></p>
        </div>
        <button class="btn"id="openFormBtn">Thêm</button>
        <table>
            <thead>
                <tr>
                    <th>Mã SV</th>
                    <th>Họ tên</th>
                    <th>Lớp</th>
                    <th>Điểm</th>
                    <th>Email</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="studentList">
                
            </tbody>
        </table>
    </div>
    <div class="modal" id="studentModal">
        <div class="modal-content">
            <h2 id="formTitle">Thêm sinh viên</h2>
            <form id="studentForm">
                <input type="text" id="studentId" placeholder="Mã sinh viên">
                <input type="text" id="studentName" placeholder="Họ và tên">
                <input type="text" id="studentClass" placeholder="Lớp">
                <input type="number" id="score" placeholder="Điểm" step="0.1" min="0" max="10">
                <input type="email" id="email" placeholder="Email">
                <div class="form-button">
                <button class="save-btn" type="submit">Lưu</button>
                <button class="cancel-btn" type="button" id="closeFormBtn">Hủy</button>
                </div>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
