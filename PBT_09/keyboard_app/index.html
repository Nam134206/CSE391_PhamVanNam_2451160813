<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keyboard App</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<!-- GALLERY -->
<div id="gallery">
    <button id="prev" aria-label="Previous image">⬅</button>
    <img id="img" src="" alt="gallery">
    <button id="next" aria-label="Next image">➡</button>
</div>

<!-- MODAL -->
<div id="modal"></div>

<!-- COMMAND PALETTE -->
<div id="cmd">
    <input id="cmdInput" placeholder="Type command... (Ctrl+K)">
    <div id="cmdList"></div>
</div>

<script src="app.js"></script>

</body>
</html>
