<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Catalog</title>


</head>

<body>

<header>
    <input id="search" placeholder="Search..." />

    <div id="categoryBar">
        <button data-category="all">All</button>
        <button data-category="phone">Phone</button>
        <button data-category="laptop">Laptop</button>
        <button data-category="tablet">Tablet</button>
        <button data-category="accessory">Accessory</button>
    </div>

    <select id="sort">
        <option value="default">Default</option>
        <option value="price_asc">Price ↑</option>
        <option value="price_desc">Price ↓</option>
        <option value="name">Name A-Z</option>
        <option value="rating">Rating</option>
    </select>

    <div>
        🛒 <span id="cartBadge">0</span>
    </div>

    <button id="darkToggle">Dark</button>
</header>

<div id="productGrid"></div>

<!-- MODAL -->
<div id="modal">
    <div id="modalContent"></div>
</div>
<script src="./app.js"></script>
</body>
</html>
