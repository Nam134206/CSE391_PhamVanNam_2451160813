<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt bàn nhà hàng</title>
    <link rel="stylesheet" href="restaurant.css">
</head>
<body>
    <header class="header">
        <div class="logo">🍽 Restaurant</div>
        <div class="phone">📞 0123456678</div>
    </header>
    <section class="hero">
        <img src="hero.jpg" alt="nhà hàng">
    </section>
    <section class="food">
        <h2>Thực đơn</h2>
        <div class="food-grid">
            <div class="food-item">
                <img src="food1.jpg" alt="Món ăn 1">
            </div>
            <div class="food-item">
                <img src="food2.jpg" alt="Món ăn 2">
            </div>
            <div class="food-item">
                <img src="food3.jpg" alt="Món ăn 3">
            </div>
            <div class="food-item">
                <img src="food4.jpg" alt="Món ăn 4">
            </div>
            <div class="food-item">
                <img src="food5.jpg" alt="Món ăn 5">
            </div>

            <div class="food-item">
                <img src="food6.jpg" alt="Món ăn 6">
            </div>
        </div>
    </section>
    <section class="booking">
        <h2>Đặt bàn</h2>
        <form class="booking-form">
            <label>
                Ngày:
                <input type="date">
            </label>
            <label>
                Giờ:
                <input type="time">
            </label>
            <label>
                Số người:
                <input type="number">
            </label>
            <label>
                Ghi chú:
                <textarea></textarea>
            </label>
            <button type="submit">Đặt bàn ngay</button>
        </form>
    </section>
    <section class="map">
        <h2>Địa chỉ</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.1234567890123!2d106.1234567890123!3d10.1234567890123!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752abcdef12345%3A0xabcdef1234567890!2sRestaurant%20Example!5e0!3m2!1sen!2s!4v1234567890123" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </section>
    <footer class="footer">
        <p>&copy; 2023 Nhà hàng. All rights reserved.</p>
    </footer>
</body>
</html>
